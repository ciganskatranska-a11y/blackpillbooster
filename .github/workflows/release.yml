name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --publish never
      - name: Wrap installer in the setup window
        shell: pwsh
        run: ./installer/pack.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @("dist\Blackpill-Booster-Setup.exe", "dist\latest.yml")
          gh release create $env:GITHUB_REF_NAME @files --title $env:GITHUB_REF_NAME.TrimStart("v") --generate-notes --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
